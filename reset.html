<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>تعيين كلمة مرور جديدة | CareerGate</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><rect width='40' height='40' rx='8' fill='%2316263A'/><path d='M10 34V18a10 10 0 0 1 20 0v16' fill='none' stroke='white' stroke-width='3'/><path d='M16 34V19a4 4 0 0 1 8 0v15' fill='none' stroke='%23B48C52' stroke-width='3'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600&family=Inter:wght@700&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
</head>
<body data-page="reset" data-auth="public">
<main class="auth">
  <div class="auth-card">
    <div class="auth-card__seal" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="auth-card__sub">اختر كلمة مرور جديدة لحسابك.</p>
    <form id="auth-form" novalidate>
      <div class="form-alert" id="form-alert" role="alert" tabindex="-1"></div>
      <div class="form-notice" id="form-notice" role="status" tabindex="-1"></div>
      <div class="auth-fields">
        <div class="field">
          <label for="password">كلمة المرور الجديدة</label>
          <div class="pw"><input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint password-error" maxlength="72"><button type="button" class="pw__toggle link-btn" aria-controls="password" aria-pressed="false">إظهار</button></div>
          <span class="hint" id="password-hint">8 أحرف على الأقل، تتضمن حرفًا ورقمًا.</span>
          <span class="error" id="password-error"></span>
        </div>
        <div class="field">
          <label for="password2">تأكيد كلمة المرور</label>
          <div class="pw"><input id="password2" name="password2" type="password" autocomplete="new-password" required aria-describedby="password2-error" maxlength="72"><button type="button" class="pw__toggle link-btn" aria-controls="password2" aria-pressed="false">إظهار</button></div>
          <span class="error" id="password2-error"></span>
        </div>
        <button class="btn btn--primary btn--block" type="submit" id="submit-btn">حفظ كلمة المرور</button>
      </div>
    </form>
    <p class="auth-card__alt"><a href="forgot.html">طلب رابط جديد</a></p>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script src="js/auth-pages.js"></script>
</body>
</html>
